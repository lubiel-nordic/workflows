name: Reusable build all workflow

on:
  workflow_call:
    inputs:
      repo_name:
        required: true
        type: string
      toolchain:
        required: true
        type: string      

jobs:
  set-image-tag:
    runs-on: ubuntu-24.04
    outputs:
      IMAGE_TAG: ${{ steps.set-output.outputs.IMAGE_TAG }}
    steps:
      - name: Checkout repository with example application
        uses: actions/checkout@v4
        with:
          path: example-application

      - name: Prepare west project
        run: |
          python3 -m pip install west
          west init -l test --mf ${{ inputs.repo_name }}.yml
          west update -o=--depth=1 -n nrf

      - name: Find toolchain bundle id
        id: set-output
        run: echo "IMAGE_TAG=$(./nrf/scripts/print_toolchain_checksum.sh)" >> $GITHUB_OUTPUT

  build-in-docker:
    needs: set-image-tag
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
    container: ghcr.io/nrfconnect/sdk-nrf-toolchain:${{ needs.set-image-tag.outputs.IMAGE_TAG }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository 
        uses: actions/checkout@v4
        with:
          path: test
    
      - name: Prepare west project
        run: |
          west init -l test --mf ${{ inputs.repo_name }}.yml
          west update -o=--depth=1 -n

      - name: Build firmware
        working-directory: test
        run: |
          west twister -T . -v --inline-logs --integration --build-only --runtime-artifact-cleanup

      - name: Genreate HTML Report
        working-directory: test
        if: always()
        run:
          junit2html twister-out/twister.xml twister-out/${{ inputs.repo_name }}_report.html

      - name: Archive test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test results ${{ matrix.course }}
          path: |
            test/twister-out/*.xml
            test/twister-out/*.json
            test/twister-out/*.log
            test/twister-out/*.html
